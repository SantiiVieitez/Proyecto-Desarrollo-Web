<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Gestión de Privilegios</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="privilegios.js"></script>
</head>
<body class="bg-light">

<div class="container py-4">
  <h2 class="mb-4">Gestión de Privilegios</h2>

  <!-- Crear privilegio -->
  <div class="card mb-3">
    <div class="card-body">
      <h5>Crear Privilegio</h5>
      <div class="input-group">
        <input type="text" id="nuevoPrivilegio" class="form-control" placeholder="Descripción del privilegio">
        <button class="btn btn-primary" onclick="crearPrivilegio()">Crear</button>
      </div>
    </div>
  </div>

  <!-- Lista de privilegios -->
  <div class="card mb-3">
    <div class="card-body">
      <h5>Privilegios existentes</h5>
      <ul id="listaPrivilegios" class="list-group"></ul>
    </div>
  </div>

  <!-- Asignar privilegio a usuario -->
  <div class="card mb-3">
    <div class="card-body">
      <h5>Asignar Privilegio a Usuario</h5>
      <div class="row g-2">
        <div class="col">
          <input type="number" id="usuarioId" class="form-control" placeholder="ID Usuario">
        </div>
        <div class="col">
          <input type="number" id="privilegioId" class="form-control" placeholder="ID Privilegio">
        </div>
        <div class="col">
          <button class="btn btn-success" onclick="asignarPrivilegio()">Asignar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Ver privilegios de usuario -->
  <div class="card">
    <div class="card-body">
      <h5>Privilegios de un Usuario</h5>
      <div class="input-group mb-2">
        <input type="number" id="usuarioConsultaId" class="form-control" placeholder="ID Usuario">
        <button class="btn btn-info" onclick="verPrivilegiosUsuario()">Ver</button>
      </div>
      <ul id="listaPrivilegiosUsuario" class="list-group"></ul>
    </div>
  </div>
</div>
