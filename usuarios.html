<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Usuarios</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="../js/auth.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", checkAuth);
</script>
</head>
<body class="bg-light">

<!-- 🔷 Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <span class="navbar-brand">Gestión de Usuarios</span>
    <a href="menu.html" class="btn btn-outline-light">🏠 Volver al Menú</a>
  </div>
</nav>

<div class="container py-5">
  <h2 class="mb-4">Usuarios</h2>

  <div class="input-group mb-3">
    <input type="text" class="form-control" id="buscador" placeholder="Buscar usuario...">
    <button class="btn btn-primary" onclick="buscar()">Buscar</button>
  </div>

  <div class="mb-3">
    <button class="btn btn-success" onclick="location.href='usuario_form.html'">Nuevo Usuario</button>
  </div>

  <table class="table table-bordered table-striped">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Activo</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="usuariosTable"></tbody>
  </table>
</div>

<script src="js/config.js"></script>
<script src="js/usuarios.js"></script>
</body>
</html>
