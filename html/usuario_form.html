<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nuevo Usuario</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- 🔷 Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <span class="navbar-brand">Gestión de Usuarios</span>
    <button class="btn btn-outline-light" onclick="history.back()">🔙 Volver</button>
  </div>
</nav>

<div class="container py-5">
  <h2 class="mb-4">Nuevo Usuario</h2>

  <div class="card p-4">
    <div class="mb-3">
      <label for="nombreUsuario" class="form-label">Nombre de usuario</label>
      <input type="text" id="nombreUsuario" class="form-control">
    </div>

    <div class="mb-3">
      <label for="clave" class="form-label">Contraseña</label>
      <input type="password" id="clave" class="form-control">
    </div>

    <div class="mb-3 form-check">
      <input type="checkbox" id="activo" class="form-check-input" checked>
      <label for="activo" class="form-check-label">Activo</label>
    </div>

    <div class="mb-3">
      <label class="form-label">Privilegios</label>
      <div id="privilegiosContainer" class="ms-2"></div>
    </div>

    <div class="d-flex gap-2">
      <button class="btn btn-primary" id="guardarBtn">Guardar</button>
      <a href="usuarios.html" class="btn btn-secondary">Cancelar</a>
    </div>
  </div>
</div>

<script src="../js/usuario_form.js"></script>
</body>
</html>
