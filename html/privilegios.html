<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Gestión de Privilegios</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="privilegios.js"></script>
</head>
<body class="bg-light">

<div class="container py-4">
  <h2 class="mb-4">Gestión de Privilegios</h2>

  <!-- Crear privilegio -->
  <div class="card mb-3">
    <div class="card-body">
      <h5>Crear Privilegio</h5>
      <div class="input-group">
        <input type="text" id="nuevoPrivilegio" class="form-control" placeholder="Descripción del privilegio">
        <button class="btn btn-primary" onclick="crearPrivilegio()">Crear</button>
      </div>
    </div>
  </div>

  <!-- Lista de privilegios -->
  <div class="card mb-3">
    <div class="card-body">
      <h5>Privilegios existentes</h5>
      <ul id="listaPrivilegios" class="list-group"></ul>
    </div>
  </div>
